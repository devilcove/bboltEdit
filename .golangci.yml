version: "2"
linters:
  default: all
  disable:
    - cyclop
    - err113
    - exhaustruct
    - exhaustive
    - forcetypeassert
    - gochecknoglobals
    - mnd
    - wrapcheck
    - depguard
    - forbidigo
    - nlreturn
    - noinlineerr
    - wsl
    - wsl_v5
  settings:
    gosec:
      excludes:
        - G706
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
